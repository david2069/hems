[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hems"
version = "0.1.2"
description = "An OUTUS v1 engine: plans, the usage ledger, dynamic prices and explainable bills"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4.18", "referencing", "rfc3339-validator"]
test = ["pytest", "jsonschema>=4.18", "referencing", "rfc3339-validator"]

[project.urls]
Homepage = "https://github.com/david2069/hems"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
